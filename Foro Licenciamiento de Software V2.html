<script>
(function () {
'use strict';
const { createApp, reactive, ref, computed, watch, nextTick, onMounted, onBeforeUnmount } = Vue;

/* ---------- constantes ---------- */
const LS_KEY = 'foro-licenciamiento-ev01';
const TEXT_KEYS = ['saludo', 'q1', 'q2', 'q3', 'q4', 'cierre'];
const ALL_KEYS = ['autor', 'ficha'].concat(TEXT_KEYS);
const Q_KEYS = ['q1', 'q2', 'q3', 'q4'];
const MIN_WORDS = 40;
const TITLES = {
  saludo: 'Saludo',
  q1: '1. ¿Qué es software?',
  q2: '2. ¿Qué es una licencia de software?',
  q3: '3. Tipos de licencia de software',
  q4: '4. ¿Cuáles son las más adecuadas y por qué?',
  cierre: 'Conclusión'
};
const CAMPOS = [
  { key: 'saludo', label: 'Saludo e introducción', rows: 3, placeholder: 'Saluda al instructor y a tus compañeros y cuenta en una o dos frases de qué trata tu aporte.' },
  { key: 'q1', q: 'PREGUNTA 1', label: '¿Qué es software?', rows: 5, placeholder: 'Define el software, diferéncialo del hardware y menciona sus tipos.' },
  { key: 'q2', q: 'PREGUNTA 2', label: '¿Qué es una licencia de software?', rows: 5, placeholder: 'Explica qué es una licencia, qué define y qué normas la regulan en Colombia.' },
  { key: 'q3', q: 'PREGUNTA 3', label: 'Tipos de licencia de software', rows: 6, placeholder: 'Describe los tipos de licencia y cuáles son los más usados hoy.' },
  { key: 'q4', q: 'PREGUNTA 4', label: '¿Cuáles son las más adecuadas y por qué?', rows: 6, placeholder: 'Argumenta qué licencia conviene según el proyecto, el cliente y los costos.' },
  { key: 'cierre', label: 'Conclusión', rows: 3, placeholder: 'Cierra con tu reflexión e invita a tus compañeros a debatir.' }
];
const PASOS = [
  { t: 'Reconoce', d: 'Un acierto concreto de su aporte.' },
  { t: 'Complementa', d: 'Un dato, norma o ejemplo que él no mencionó.' },
  { t: 'Cuestiona', d: 'Una idea que matizarías y por qué.' },
  { t: 'Invita', d: 'Una pregunta que siga el debate.' }
];

/* Borrador sugerido: responde las cuatro preguntas orientadoras del foro */
const DRAFT = {
saludo: `Cordial saludo, instructor y compañeros.

Comparto mi aporte al foro sobre licenciamiento de software. Lo organicé según las cuatro preguntas orientadoras y al final propongo qué licencias convienen a nuestro proyecto formativo, Construcción de software integrador de tecnologías orientadas a servicios.`,
q1: `El software es el conjunto de programas, instrucciones, datos y documentación que le indican a un equipo de cómputo qué hacer y cómo hacerlo. Es la parte lógica de un sistema informático; el hardware es la parte física.

En Colombia el software tiene definición legal. La Decisión Andina 351 de 1993 lo describe como la expresión de un conjunto de instrucciones que, incorporadas en un dispositivo, hacen que un computador ejecute una tarea u obtenga un resultado. El Decreto 1360 de 1989 lo llama «soporte lógico» e incluye en él el programa de computador, su descripción y el material auxiliar, como los manuales. Para la ley, entonces, el software es una obra protegida por el derecho de autor, igual que un libro o una canción.

Se suele clasificar en tres grupos:
• Software de sistema: sistemas operativos y controladores, como Windows, Linux o Android.
• Software de aplicación: programas para tareas del usuario, como ofimática, navegadores o sistemas de facturación.
• Software de programación: herramientas para crear otros programas, como compiladores, editores de código y frameworks.`,
q2: `Una licencia de software es un contrato entre el titular de los derechos de autor de un programa (licenciante) y quien lo va a usar (licenciatario). Con la licencia el titular no vende el programa, sino que autoriza ciertos usos bajo unas condiciones. Cuando una empresa compra Windows, adquiere el derecho de usarlo en un equipo, no la propiedad del código.

Una licencia normalmente define:
• Qué se puede hacer: instalar, copiar, modificar, distribuir o usar con fines comerciales.
• El alcance: número de usuarios, equipos o núcleos, y el territorio.
• La duración: perpetua o por suscripción.
• El costo y la forma de pago, si los hay.
• Las restricciones, como la prohibición de hacer ingeniería inversa o de revender.
• Las garantías y los límites de responsabilidad.

En Colombia el marco legal lo forman la Ley 23 de 1982 sobre derechos de autor, la Ley 44 de 1993, el Decreto 1360 de 1989 y la Decisión Andina 351 de 1993. Usar software sin la licencia correspondiente es piratería y puede traer sanciones civiles y penales; el Código Penal (Ley 599 de 2000) la castiga como violación a los derechos patrimoniales de autor. Por eso, al formular la propuesta técnica de un proyecto no basta con elegir la tecnología: también hay que revisar sus licencias y lo que cuestan.`,
q3: `Las licencias se pueden agrupar según la libertad que dan sobre el código fuente:

• Propietarias o privativas. El código es cerrado y el usuario acepta un contrato de licencia de usuario final (EULA). Ejemplos: Windows, Microsoft 365, Adobe Photoshop y Oracle Database. Sus modalidades más comunes son la perpetua, la suscripción, la OEM (preinstalada en el equipo), la licencia por volumen para empresas y la académica.

• Freeware, shareware y freemium. El freeware se usa gratis pero el código sigue cerrado, como Adobe Acrobat Reader. El shareware se prueba por un tiempo o con funciones limitadas antes de pagar, como WinRAR. Hoy predomina el freemium: una versión básica gratuita y funciones avanzadas de pago.

• Software libre con copyleft. Parte de las cuatro libertades que define la Free Software Foundation: usar, estudiar, distribuir y mejorar el programa. El copyleft obliga a que las versiones modificadas se distribuyan con la misma licencia. Hay copyleft fuerte, como la GPL-2.0 (núcleo de Linux), la GPL-3.0 y la AGPL-3.0, que extiende la obligación al software que se ofrece por internet; y copyleft débil, como la LGPL y la MPL-2.0, que permiten usar la librería desde software cerrado pero exigen compartir los cambios hechos a la librería.

• Código abierto permisivo. Permite usar, modificar e incluso incluir el código en un producto comercial cerrado, con pocas condiciones, como conservar el aviso de derechos de autor. Las más conocidas son MIT (React, Node.js), Apache-2.0 (Spring Boot, Kubernetes), que además incluye una concesión expresa de patentes, y BSD (Django).

• Dominio público y Creative Commons. CC0 y Unlicense renuncian a casi todos los derechos. Las licencias Creative Commons sirven para documentación, imágenes y contenidos, pero no se recomiendan para código.

• Código disponible (source-available). Dejan ver el código pero restringen algunos usos comerciales, como la Business Source License. La Open Source Initiative no las considera código abierto.

¿Cuáles se usan más hoy? En su ranking de 2025, la Open Source Initiative reportó que la licencia MIT fue la más consultada, con cerca de 1,53 millones de visitas, seguida por Apache-2.0 (344 mil), BSD-3-Clause (214 mil), BSD-2-Clause (128 mil), GPL-2.0 (76 mil) y GPL-3.0 (55 mil). El dato hay que leerlo con cuidado, porque mide visitas a la página de cada licencia y no proyectos que la usan; aun así muestra el peso de las licencias permisivas. En el software comercial la tendencia es pasar de la licencia perpetua a la suscripción, como ocurrió con Microsoft 365 y Adobe Creative Cloud. Además, algunas empresas cambiaron proyectos abiertos a licencias de código disponible, y la comunidad respondió con bifurcaciones abiertas como OpenTofu (de Terraform) y Valkey (de Redis).`,
q4: `No hay una licencia mejor que todas. La adecuada depende del tipo de proyecto, del modelo de negocio y de las licencias de los componentes que usamos. Mi análisis:

• Para el proyecto formativo que publicamos en GitHub recomiendo Apache-2.0 o MIT. Son fáciles de entender, permiten que otros reutilicen el código y son compatibles con la mayoría de librerías. Me inclino por Apache-2.0 si el proyecto puede llegar a una empresa, porque protege frente a reclamos por patentes.
• Para software a la medida que se entrega a un cliente, lo adecuado es un contrato que defina la licencia o la cesión de derechos patrimoniales. En las obras creadas por contrato de prestación de servicios o de trabajo, la ley colombiana presume, salvo pacto en contrario, que esos derechos pasan a quien encarga la obra, siempre que el contrato conste por escrito (art. 20 de la Ley 23 de 1982, modificado por la Ley 1450 de 2011). Por eso conviene dejarlo claro en la propuesta técnica.
• Si queremos que toda mejora vuelva a la comunidad, la opción es GPL-3.0; y si el sistema se ofrece como servicio web, AGPL-3.0.
• Para manuales y documentación, Creative Commons BY o BY-SA.

Antes de elegir hay que revisar la compatibilidad de las dependencias. React y Node.js usan MIT, Spring Boot usa Apache-2.0, PostgreSQL tiene su propia licencia permisiva y MySQL Community se distribuye bajo GPL-2.0 con una licencia comercial aparte. Si un producto cerrado incorpora código GPL, queda obligado a liberar su código al distribuirlo.

También pesa el costo. Una licencia propietaria implica pagos por usuario o por equipo que deben quedar en la propuesta económica. El software libre ahorra ese pago, pero no es gratis del todo: requiere soporte, capacitación y mantenimiento. Por eso la decisión se debe tomar con el costo total de propiedad y no solo con el precio de compra.`,

Quedo atento a sus aportes. Me interesa saber qué licencia eligieron para su proyecto y por qué.`

const App = {
  name: 'ForoLicenciamiento',
  components: { CampoTexto, TarjetaReplica },
  setup() {
    const state = reactive({
      mode: 'loading',            // 'db' | 'local'
      loaded: false,
      readOnly: false,
      aporte: blank(),
      hasAporte: false,
      emptyDismissed: false,
      dirty: false,
      saving: false,
      lastSavedAt: null,
      status: { kind: 'loading', extra: '' },
      restoreConfirm: false,
      replicas: [],
      form: { companero: '', comentario: '', respuesta: '' },
      formMsg: { text: '', ok: false },
      editingId: null,
      confirmDeleteId: null,
      savingReply: false,
      canSuggest: false,
      suggest: { visible: false, text: '', waiting: false, running: false, msg: '' },
      canDownload: true,
      pdfBusy: false,
      fallbackText: null,
      toast: ''
    });

    const formEl = ref(null), respuestaEl = ref(null), fallbackEl = ref(null);
    let db = null, sampleFn = null, downloads = null;
    let saveTimer = null, pendingSave = false, ctl = null, toastTimer = null;

    /* ----- valores derivados ----- */
    const editable = computed(() => state.loaded && !state.readOnly);
    const totalWords = computed(() => TEXT_KEYS.reduce((s, k) => s + words(state.aporte[k]), 0));
    const qEstado = computed(() => Q_KEYS.map(k => {
      const n = words(state.aporte[k]);
      return n >= MIN_WORDS ? 'done' : (n > 0 ? 'part' : '');
    }));
    const qListas = computed(() => qEstado.value.filter(s => s === 'done').length);
    const realReplicas = computed(() => state.replicas.filter(r => !r.ejemplo));
    const showEmpty = computed(() => state.loaded && !state.readOnly && !state.hasAporte && !state.emptyDismissed
      && TEXT_KEYS.every(k => !(state.aporte[k] || '').trim()));
    const canSaveTop = computed(() => !state.readOnly && state.loaded && (state.dirty || state.status.kind === 'error'));
    const savedAtText = computed(() => state.lastSavedAt ? 'Último guardado: ' + fmtTime(state.lastSavedAt) : 'Sin guardar todavía');
    const whereText = computed(() => {
      if (state.mode === 'db') return 'Se guarda en tu cuenta de Claude y lo ves desde cualquier dispositivo.';
      if (state.mode === 'local') return 'Se guarda solo en este navegador. Para no perderlo, descárgalo o cópialo al terminar.';
      return 'Conectando con el almacenamiento…';
    });
    const pill = computed(() => {
      const k = state.status.kind;
      if (k === 'loading') return { tone: 'busy', text: 'Cargando tu aporte…' };
      if (k === 'saving') return { tone: 'busy', text: 'Guardando…' };
      if (k === 'dirty') return { tone: 'warn', text: 'Cambios sin guardar' };
      if (k === 'saved') return { tone: 'ok', text: (state.mode === 'db' ? 'Guardado' : 'Guardado en este navegador') + (state.lastSavedAt ? ' · ' + fmtTime(state.lastSavedAt) : '') };
      if (k === 'readonly') return { tone: '', text: 'Solo lectura' };
      if (k === 'error') return { tone: 'bad', text: state.status.extra || 'No se pudo guardar' };
      return { tone: 'ok', text: state.mode === 'db' ? 'Todo guardado' : 'Listo para escribir' };
    });

    /* ----- avisos ----- */
    function setStatus(kind, extra) { state.status = { kind, extra: extra || '' }; }
    function toast(msg) {
      state.toast = msg; clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { state.toast = ''; }, 2600);
    }
    function formMsg(text, ok) { state.formMsg = { text: text || '', ok: !!ok }; }

    /* ----- respaldo local ----- */
    function plainAporte() { const o = {}; ALL_KEYS.forEach(k => { o[k] = state.aporte[k] || ''; }); return o; }
    function lsRead() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } }
    function lsWrite() {
      try { localStorage.setItem(LS_KEY, JSON.stringify({ aporte: plainAporte(), replicas: state.replicas })); return true; }
      catch (e) { return false; }
    }

    /* ----- aporte ----- */
    function applyAporte(d) {
      ALL_KEYS.forEach(k => { state.aporte[k] = typeof d[k] === 'string' ? d[k] : ''; });
      if (d.updatedAt) { const t = new Date(d.updatedAt); if (!isNaN(t)) state.lastSavedAt = t; }
    }
    function editingNow() { const a = document.activeElement; return !!(a && a.id && a.id.indexOf('f-') === 0); }

    function setField(k, v) {
      if (state.readOnly) return;
      state.aporte[k] = v;
      state.dirty = true; setStatus('dirty');
      clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 1200);
    }
    function flush() { if (state.dirty) saveNow(); }
    function saveClick() { state.dirty = true; saveNow(); }

    async function saveNow() {
      clearTimeout(saveTimer);
      if (state.readOnly || !state.loaded) return;
      if (state.saving) { pendingSave = true; return; }
      if (!state.dirty) return;
      state.saving = true; state.dirty = false; setStatus('saving');
      const body = plainAporte(); body.updatedAt = new Date().toISOString();
      try {
        if (state.mode === 'db') await db.doc('foro/aporte').set(body);
        const okLocal = lsWrite();
        if (state.mode === 'local' && !okLocal) throw { code: 'local_failed' };
        state.hasAporte = true; state.lastSavedAt = new Date();
        setStatus(state.dirty ? 'dirty' : 'saved');
      } catch (e) {
        state.dirty = true; handleWriteError(e);
      } finally {
        state.saving = false;
        if (pendingSave) { pendingSave = false; saveNow(); }
      }
    }

    function handleWriteError(e) {
      const code = e && e.code;
      if ((code === 'invalid_argument' && state.mode === 'db') || code === 'revoked') { setReadOnly(true); return; }
      if (code === 'quota_exceeded') { setStatus('error', 'Se llenó el espacio de almacenamiento. Borra réplicas que no uses.'); return; }
      if (code === 'local_failed') { setStatus('error', 'Este navegador no permite guardar. Copia o descarga tu aporte.'); return; }
      setStatus('error', 'No se pudo guardar. Revisa tu conexión y pulsa Guardar.');
    }
    function setReadOnly(v) {
      state.readOnly = v;
      if (v) { state.canSuggest = false; setStatus('readonly'); }
    }

    function fillDraft() {
      applyAporte(Object.assign({}, DRAFT, { autor: state.aporte.autor, ficha: state.aporte.ficha }));
      state.dirty = true; saveNow();
    }
    function useDraft() { state.emptyDismissed = true; fillDraft(); }
    function startBlank() {
      state.emptyDismissed = true;
      nextTick(() => { const f = document.getElementById('f-autor'); if (f) f.focus(); });
    }
    function restoreDraft() { state.restoreConfirm = false; fillDraft(); toast('Borrador sugerido restaurado'); }

    /* ----- réplicas ----- */
    function resetForm() {
      state.editingId = null;
      state.form = { companero: '', comentario: '', respuesta: '' };
    }
    function startEdit(r) {
      state.editingId = r.id;
      state.form = { companero: r.companero || '', comentario: r.comentario || '', respuesta: r.respuesta || '' };
      formMsg('');
      nextTick(() => {
        if (formEl.value) formEl.value.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (respuestaEl.value) respuestaEl.value.focus({ preventScroll: true });
      });
    }
    function cancelEdit() { resetForm(); formMsg(''); }

    async function saveReply() {
      if (state.readOnly) return;
      if (!state.loaded) { formMsg('Espera un momento: todavía se está cargando el almacenamiento.'); return; }
      const companero = state.form.companero.trim();
      const comentario = state.form.comentario.trim();
      const respuesta = state.form.respuesta.trim();
      if (!comentario || !respuesta) { formMsg('Pega el comentario de tu compañero y escribe tu réplica antes de guardar.'); return; }
      const now = new Date().toISOString();
      state.savingReply = true;
      try {
        if (state.mode === 'db') {
          if (state.editingId) await db.doc('replicas/' + state.editingId).update({ companero, comentario, respuesta, ejemplo: false, updatedAt: now });
          else await db.collection('replicas').add({ companero, comentario, respuesta, ejemplo: false, createdAt: now, updatedAt: now });
        } else {
          if (state.editingId) {
            const r = state.replicas.find(x => x.id === state.editingId);
            if (r) Object.assign(r, { companero, comentario, respuesta, ejemplo: false, updatedAt: now });
          } else {
            state.replicas.unshift({ id: 'r' + Date.now(), companero, comentario, respuesta, ejemplo: false, createdAt: now, updatedAt: now });
          }
          if (!lsWrite()) throw { code: 'local_failed' };
        }
        resetForm(); formMsg('Réplica guardada.', true);
      } catch (err) {
        handleWriteError(err);
        formMsg('No se pudo guardar la réplica. Tu texto sigue en el formulario.');
      } finally {
        state.savingReply = false;
      }
    }

    async function deleteReply(id) {
      state.confirmDeleteId = null;
      try {
        if (state.mode === 'db') await db.doc('replicas/' + id).delete();
        else { state.replicas = state.replicas.filter(r => r.id !== id); lsWrite(); }
        if (state.editingId === id) resetForm();
        toast('Réplica eliminada');
      } catch (err) { handleWriteError(err); }
    }

    /* ----- propuesta de réplica con Claude ----- */
    const HIDE_CODES = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
    function sampleMessage(code) {
      switch (code) {
        case 'rate_limited': return 'Hay demasiadas solicitudes en este momento. Intenta de nuevo en un rato.';
        case 'session_expired': return 'Tu sesión expiró. Vuelve a iniciar sesión e intenta otra vez.';
        case 'refused': return 'Claude no pudo responder a este comentario. Revisa el texto e intenta con otro.';
        case 'empty_completion': return 'No llegó ninguna respuesta. Prueba con un comentario más corto.';
        case 'prompt_too_large': return 'El comentario es demasiado largo. Pega solo la parte que quieres responder.';
        default: return 'Se interrumpió la conexión. Puedes intentarlo de nuevo.';
      }
    }
    function buildPrompt(companero, comentario) {
      const contexto = (state.aporte.q4 || '').slice(0, 1800)
        || 'Defiendo elegir la licencia según el proyecto, el cliente y los costos de licenciamiento.';
      return 'Eres aprendiz del SENA en el programa Análisis y desarrollo de software y participas en el foro temático "Licenciamiento de software". '
        + 'Escribe en español de Colombia una réplica crítico-reflexiva de 120 a 180 palabras al comentario de un compañero.\n\n'
        + 'Estructura, en prosa continua y sin títulos ni viñetas:\n'
        + '1. Saluda al compañero' + (companero ? ' por su nombre (' + companero + ')' : '') + ' y reconoce un acierto concreto de su comentario.\n'
        + '2. Complementa o corrige con un argumento técnico, económico o legal. Menciona normas colombianas (Ley 23 de 1982, Decisión Andina 351 de 1993, Decreto 1360 de 1989) solo si vienen al caso, y no inventes cifras ni artículos.\n'
        + '3. Matiza con respeto una idea con la que no estés del todo de acuerdo, si la hay.\n'
        + '4. Cierra con una pregunta que invite a seguir el debate.\n\n'
        + 'Usa primera persona y un tono respetuoso. Devuelve solo el texto de la réplica.\n\n'
        + 'Mi postura en el foro (resumen, solo como contexto):\n' + contexto + '\n\n'
        + 'Comentario del compañero:\n' + comentario;
    }
    async function suggestReply() {
      if (!sampleFn) return;
      const comentario = state.form.comentario.trim();
      if (!comentario) { formMsg('Primero pega el comentario de tu compañero.'); return; }
      formMsg('');
      ctl = new AbortController();
      state.suggest = { visible: true, text: '', waiting: true, running: true, msg: '' };
      try {
        const res = await sampleFn(buildPrompt(state.form.companero.trim(), comentario), {
          signal: ctl.signal, modelTier: 'default',
          onText: ({ text }) => { state.suggest.waiting = false; state.suggest.text = text; }
        });
        state.suggest.waiting = false; state.suggest.text = res.text;
        if (res.truncated) state.suggest.msg = 'La propuesta quedó incompleta. Revísala antes de usarla.';
      } catch (err) {
        const code = err && err.code;
        state.suggest.waiting = false;
        state.suggest.text = (err && err.text) || '';
        if (HIDE_CODES.includes(code)) {
          state.suggest.visible = false; state.canSuggest = false; sampleFn = null;
          formMsg('La ayuda de Claude no está disponible en esta vista. Puedes escribir tu réplica a mano.');

        state.suggest.running = false; ctl = null;
