<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Foro Licenciamiento de Software</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@500;600;700&display=swap">

  <!-- Animación de inicio: CSS crítico en línea para que se pinte antes de cargar el JS.
       Solo anima opacity y transform (los procesa la GPU, sin recalcular layout). -->
  <script>
    // Se muestra una sola vez por sesión; al recargar o navegar no vuelve a aparecer.
    try {
      if (sessionStorage.getItem('intro-visto')) document.documentElement.classList.add('sin-intro')
      else { sessionStorage.setItem('intro-visto', '1'); document.documentElement.classList.add('intro') }
    } catch (e) { document.documentElement.classList.add('intro') }
  </script>
  <style>
    #splash {
      --s-bg: #F5F6FB; --s-fg: #141A33; --s-muted: #5B6280; --s-accent: #4F46E5; --s-accent-2: #0EA5A4;
      position: fixed; inset: 0; z-index: 999;
      display: grid; place-items: center;
      background: var(--s-bg); color: var(--s-fg);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      transition: opacity .45s ease, visibility .45s;
    }
    @media (prefers-color-scheme: dark) {
      #splash { --s-bg: #0B0E1A; --s-fg: #E8EAF6; --s-muted: #9AA0BF; --s-accent: #A5B4FC; --s-accent-2: #5EEAD4; }
    }
    .sin-intro #splash { display: none; }
    #splash.salir { opacity: 0; visibility: hidden; }
    #splash.salir .splash-inner { transform: scale(1.04); }

    .splash-inner { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 16px; transition: transform .45s ease; }
    .splash-logo {
      width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 30px;
      background: linear-gradient(135deg, var(--s-accent), var(--s-accent-2));
      box-shadow: 0 10px 30px color-mix(in srgb, var(--s-accent) 35%, transparent);
      animation: s-pop .6s cubic-bezier(.34, 1.56, .64, 1) both;
    }
    .splash-eyebrow {
      font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--s-muted);
      animation: s-up .5s cubic-bezier(.2, .7, .3, 1) .15s both;
    }
    .splash-title {
      margin: 0; font-family: 'Sora', system-ui, sans-serif; font-size: clamp(22px, 5vw, 30px); font-weight: 700;
      animation: s-up .5s cubic-bezier(.2, .7, .3, 1) .25s both;
    }
    .splash-title span { color: var(--s-accent); }
    .splash-bar {
      width: 160px; height: 3px; border-radius: 99px; overflow: hidden; margin-top: 6px;
      background: color-mix(in srgb, var(--s-muted) 20%, transparent);
      animation: s-up .5s ease .35s both;
    }
    .splash-bar::after {
      content: ''; display: block; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, var(--s-accent), var(--s-accent-2));
      transform-origin: left; animation: s-carga 1.1s cubic-bezier(.4, 0, .2, 1) .35s both;
    }
    @keyframes s-pop { from { opacity: 0; transform: scale(.6) rotate(-8deg); } }
    @keyframes s-up { from { opacity: 0; transform: translateY(10px); } }
    @keyframes s-carga { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    @media (prefers-reduced-motion: reduce) {
      #splash, #splash * { animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-inner">
      <div class="splash-logo">⚖️</div>
      <div class="splash-eyebrow">SENA • ADSO</div>
      <h1 class="splash-title">Foro: <span>Licenciamiento de software</span></h1>
      <div class="splash-bar"></div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
